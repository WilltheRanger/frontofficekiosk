name: Deploy kiosk to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/diamond-bar-kiosk-planning-9is4rx
  workflow_dispatch:

permissions:
  contents: write # pushes the built site to the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Public by design (they ship in the client bundle); RLS keeps the
          # kiosk read-only — see supabase/migrations/0001_kiosk_v1.sql.
          VITE_SUPABASE_URL: https://mnvntttootxbbbnsnvke.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_TLnFfdFCkX0_NoLFenvEqA_MGqjWmqV
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
